name: Fetch legacy site photos (one-off)

on:
  push:
    branches: [content/legacy-photos]
    paths: [.github/workflows/fetch-legacy-photos.yml]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download every image linked from forgemetal.com
        run: |
          mkdir -p legacy-photos
          for page in index about-consolidated-industries-company forging-capabilities engineering-design-services \
                      finishing-processes continuous-improvement products-aircraft-forgings products-military-forgings \
                      products-turbine-engine-forgings products-transportation-industry-forgings \
                      products-industrial-commercial-forgings aircraft-programs-served employment-opportunities \
                      memberships-committees accreditations-certificates-affiliations related-companies; do
            wget --page-requisites --span-hosts --domains=www.forgemetal.com,forgemetal.com -e robots=off \
                 --no-directories --accept jpg,jpeg,png,JPG,JPEG,PNG --directory-prefix=legacy-photos \
                 --wait=2 --random-wait --tries=2 --timeout=20 --user-agent="Mozilla/5.0 (CII website rebuild)" \
                 "https://www.forgemetal.com/${page}.php" || true
          done
          ls -la legacy-photos | head -100
          echo "count: $(ls legacy-photos | wc -l)"
      - name: Commit photos to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legacy-photos
          git commit -m "chore: legacy forgemetal.com images (raw download)" || echo "nothing to commit"
          git push
