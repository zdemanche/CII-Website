name: CI and GitHub Pages preview

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check, build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx astro check
      - name: Production build + tests
        run: npm run test:prod
      - name: Demo build (base path) + tests
        env:
          DEMO: '1'
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npx astro build && node --test test/*.test.mjs

  deploy:
    name: Deploy preview to GitHub Pages
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - name: Build demo
        env:
          DEMO: '1'
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npx astro build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

  lighthouse:
    name: Lighthouse (mobile, advisory)
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
            https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/capabilities/
            https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/contact/
          uploadArtifacts: true
          temporaryPublicStorage: true
