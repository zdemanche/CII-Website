name: CI and GitHub Pages preview

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check, build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx astro check
      - name: Production build + tests
        run: npm run test:prod
      - name: Demo build (base path) + tests
        env:
          DEMO: '1'
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npx astro build && node --test test/*.test.mjs

  deploy:
    name: Deploy preview to GitHub Pages
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - name: Build demo
        env:
          DEMO: '1'
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npx astro build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

  lighthouse:
    name: Lighthouse (mobile, advisory)
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Pages to serve the new build
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${{ needs.deploy.outputs.page_url }}")
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::warning::Pages URL not reachable yet; Lighthouse may be skipped"
      - name: Run Lighthouse
        # Advisory only: scores are reported, never block the pipeline.
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ needs.deploy.outputs.page_url }}
            ${{ needs.deploy.outputs.page_url }}capabilities/
            ${{ needs.deploy.outputs.page_url }}contact/
          uploadArtifacts: true
          temporaryPublicStorage: true
